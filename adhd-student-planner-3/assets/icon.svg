<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Warm Roasted Espresso Cacao -->
    <linearGradient id="bgWarmZen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241a15"/>
      <stop offset="50%" stop-color="#181310"/>
      <stop offset="100%" stop-color="#100c0a"/>
    </linearGradient>

    <!-- Warm Italian Terracotta Gradient -->
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f49c7f"/>
      <stop offset="50%" stop-color="#e07a5f"/>
      <stop offset="100%" stop-color="#ba5338"/>
    </linearGradient>

    <!-- Matcha Sage Zen Balance Gradient -->
    <linearGradient id="matchaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d5ba"/>
      <stop offset="50%" stop-color="#81b29a"/>
      <stop offset="100%" stop-color="#588157"/>
    </linearGradient>

    <!-- Gentle Warm Sun Gold -->
    <linearGradient id="warmSunGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1c5"/>
      <stop offset="50%" stop-color="#f2cc8f"/>
      <stop offset="100%" stop-color="#d4a359"/>
    </linearGradient>

    <filter id="warmZenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgWarmZen)"/>
  
  <!-- Outer Linen Border Hairline -->
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="rgba(224, 122, 95, 0.28)" stroke-width="2.5"/>

  <!-- Concentric Zen Balance Rings (Radial Dial Geometry) -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="rgba(242, 204, 143, 0.08)" stroke-width="28"/>
  <circle cx="256" cy="256" r="162" fill="none" stroke="url(#terracottaGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="240 240" filter="url(#warmZenGlow)"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="url(#matchaGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="160 200" opacity="0.9"/>

  <!-- Mindful Zen Sanctuary Center Pebble -->
  <circle cx="256" cy="256" r="95" fill="#2c221c" stroke="rgba(242, 204, 143, 0.25)" stroke-width="2"/>

  <!-- Open Academic Wisdom Book & Sprout Motif -->
  <g transform="translate(186, 192) scale(2.8)" stroke="url(#warmSunGold)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Open Book Pages -->
    <path d="M2 3h8a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
    <path d="M22 3h-8a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h9z"/>
    <!-- Zen Center Bookmark Ribbon -->
    <path d="M12 7v10" stroke="url(#terracottaGrad)" stroke-width="1.5"/>
  </g>

  <!-- Subtle Zen Sparkle -->
  <circle cx="340" cy="150" r="4" fill="url(#warmSunGold)" filter="url(#warmZenGlow)"/>
  <circle cx="160" cy="350" r="3" fill="url(#matchaGrad)" opacity="0.8"/>
</svg>
