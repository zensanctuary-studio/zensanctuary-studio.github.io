  <!-- Background circle -->
  <rect width="512" height="512" rx="128" fill="url(#zenGlow)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#332a24" stroke-width="6" stroke-dasharray="8 8"/>
  
  <!-- Outer Ensō Ring (Zen Incomplete Circle) -->
