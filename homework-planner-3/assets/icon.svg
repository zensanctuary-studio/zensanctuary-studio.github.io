  <line x1="256" y1="220" x2="256" y2="340" stroke="url(#sandPath)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Mindful Hearth Glow / Spark -->
  <circle cx="256" cy="160" r="18" fill="url(#warmSun)"/>
  <circle cx="256" cy="160" r="32" fill="none" stroke="#e08a65" stroke-width="4" opacity="0.6"/>
