      <stop offset="0%" stop-color="#2a221d"/>
      <stop offset="100%" stop-color="#161311"/>
    </radialGradient>
    <linearGradient id="warmSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e08a65"/>
      <stop offset="100%" stop-color="#c27050"/>
    </linearGradient>
    <linearGradient id="sandPath" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b483"/>
